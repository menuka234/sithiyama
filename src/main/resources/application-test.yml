# ---------------------------------------------------------------------------
# "test" profile - schema generated by Hibernate on in-memory H2.
# Keeps `mvn test` fast and free of Docker.
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: jdbc:h2:mem:sithiyama-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

sithiyama:
  jwt:
    secret: test-only-signing-key-for-sithiyama-backend-unit-tests-0123456789
    issuer: sithiyama-backend-test
    access-token-ttl: PT1H
  spatial:
    enabled: false
