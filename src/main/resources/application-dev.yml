# ---------------------------------------------------------------------------
# "dev" profile - runs with zero external dependencies (in-memory H2).
#
#   .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=dev
#
# Notes:
#   * H2 has no PostGIS, so Flyway is disabled and Hibernate creates the schema.
#   * Radius ("near") route search falls back to a bounding-box approximation,
#     because the PostGIS geometry column does not exist here.
#   * No seed data is inserted; register a user and create routes through the API.
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: jdbc:h2:mem:sithiyama;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

sithiyama:
  spatial:
    enabled: false
