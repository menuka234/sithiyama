spring:
  application:
    name: sithiyama-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/sithiyama}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:menuka@2004##}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      pool-name: sithiyama-pool

  jpa:
    # Flyway owns the schema for PostgreSQL; Hibernate never alters it.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
          time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ---------------------------------------------------------------------------
# SITHIYAMA application settings
# ---------------------------------------------------------------------------
sithiyama:
  jwt:
    # HS256 signing key. MUST be at least 32 bytes. Override with JWT_SECRET in production.
    secret: ${JWT_SECRET:sithiyama-development-only-signing-key-change-me-please-0123456789}
    issuer: sithiyama-backend
    access-token-ttl: PT12H
  spatial:
    # When true, radius ("near") route search uses PostGIS geometry columns.
    # Requires the Flyway migrations to have run against a real PostGIS database.
    enabled: true
  ai:
    gemini:
      # Google AI Studio key. Leave blank to use the built-in route facts only.
      # Get one at https://aistudio.google.com/app/apikey
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      timeout-seconds: ${GEMINI_TIMEOUT_SECONDS:30}
