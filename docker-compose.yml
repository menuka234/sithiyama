services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sithiyama-db
    environment:
      POSTGRES_DB: sithiyama
      POSTGRES_USER: sithiyama
      POSTGRES_PASSWORD: sithiyama
    ports:
      # Host port 5433 by default so a PostgreSQL already installed on the
      # machine (which usually claims 5432) does not shadow the container.
      # Override with DB_PORT if you prefer another host port.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - sithiyama-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sithiyama -d sithiyama"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    container_name: sithiyama-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/sithiyama
      DB_USERNAME: sithiyama
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sithiyama}
      # Change this before shipping anywhere real.
      JWT_SECRET: ${JWT_SECRET:-sithiyama-compose-signing-key-change-me-0123456789abcdef}
      SERVER_PORT: 8080
      # Optional: enables Gemini answers; leave empty for route-data-only answers.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  sithiyama-db-data:
